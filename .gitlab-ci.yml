stages:
  - test
  - build
  - deploy

.java_test_template: &java_test_job
  stage: test
  image: maven:3.8.5-openjdk-17
  # tags: [local-deploy] # As tags foram removidas para usar Shared Runners
  script:
    - cd $SERVICE_PATH
    - mvn test
  rules:
    - if: '$CI_COMMIT_BRANCH == "LuSilva-dev"'

.node_test_template: &node_test_job
  stage: test
  image: node:18
  # tags: [local-deploy] # As tags foram removidas para usar Shared Runners
  before_script:
    - cd $SERVICE_PATH
    - npm install
  script:
    - npm test
  rules:
    - if: '$CI_COMMIT_BRANCH == "LuSilva-dev"'

# Template para jobs de build de imagem Docker
.docker_build_template: &docker_build_job
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "Iniciando login no GitLab Container Registry..."
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo "Iniciando login no Docker Hub..."
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_PASSWORD"

  script:
    - cd $SERVICE_PATH
    
    # 1. Constrói a imagem para o GitLab Registry
    - IMAGE_PATH=$(echo "$CI_REGISTRY/$CI_PROJECT_PATH/$SERVICE_NAME" | tr '[:upper:]' '[:lower:]')
    - docker build -t $IMAGE_PATH:$CI_COMMIT_SHORT_SHA -t $IMAGE_PATH:latest .
    
    # 2. Faz o push para o GitLab Registry
    - docker push $IMAGE_PATH:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_PATH:latest
    
    # 3. Adiciona login e push para o Docker Hub
    - echo "Iniciando login no Docker Hub..."
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD

    # 4. Constrói a imagem para o Docker Hub (com o seu username)
    - DOCKERHUB_IMAGE_PATH="<lusilva97>/$SERVICE_NAME"
    - docker tag $IMAGE_PATH:$CI_COMMIT_SHORT_SHA $DOCKERHUB_IMAGE_PATH:$CI_COMMIT_SHORT_SHA
    - docker tag $IMAGE_PATH:latest $DOCKERHUB_IMAGE_PATH:latest

    # 5. Faz o push para o Docker Hub
    - docker push $DOCKERHUB_IMAGE_PATH:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKERHUB_IMAGE_PATH:latest
  
  rules:
    - if: '$CI_COMMIT_BRANCH == "LuSilva-dev"'

# ========= JOBS DE TESTE =========

test:config-server:
  <<: *java_test_job
  variables:
    SERVICE_PATH: Config-Server

test:discovery-server:
  <<: *java_test_job
  variables:
    SERVICE_PATH: discovery-server

test:api-gateway:
  <<: *java_test_job
  variables:
    SERVICE_PATH: api-gateway

test:property-service:
  <<: *java_test_job
  variables:
    SERVICE_PATH: Property-Service

test:auth-backend:
  <<: *node_test_job
  variables:
    SERVICE_PATH: Autentication-Users/Back-End


# ========= ESTÁGIO DE BUILD =========

build:config-server:
  <<: *docker_build_job
  variables:
    SERVICE_PATH: "Config-Server"
    SERVICE_NAME: "config-server"

build:discovery-server:
  <<: *docker_build_job
  variables:
    SERVICE_PATH: "discovery-server"
    SERVICE_NAME: "discovery-server"

build:api-gateway:
  <<: *docker_build_job
  variables:
    SERVICE_PATH: "api-gateway"
    SERVICE_NAME: "api-gateway"

build:property-service:
  <<: *docker_build_job
  variables:
    SERVICE_PATH: "Property-Service"
    SERVICE_NAME: "property-service"

build:auth-backend:
  <<: *docker_build_job
  variables:
    SERVICE_PATH: "Autentication-Users/Back-End"
    SERVICE_NAME: "auth-backend"

build:auth-frontend:
  <<: *docker_build_job
  variables:
    SERVICE_PATH: "Autentication-Users/Front-End"
    SERVICE_NAME: "auth-frontend"

build:farm-production: # <--- JOB ADICIONADO/CORRIGIDO
  <<: *docker_build_job
  variables:
    SERVICE_PATH: "farm-production"
    SERVICE_NAME: "farm-production"

# ========= ESTÁGIO DE DEPLOY =========

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H 192.168.0.102 >> ~/.ssh/known_hosts
  script:
    - echo "Iniciando deploy via SSH na máquina local..."
    - |
      ssh devsshuser@192.168.0.102 << 'EOF'
        cd c/Users/55319/cultivatech/
        git pull origin LuSilva-dev
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker-compose -f docker-compose.prod.yml pull
        docker-compose -f docker-compose.prod.yml up -d --remove-orphans
        docker image prune -f
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "LuSilva-dev"'