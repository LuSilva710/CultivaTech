# Nome do workflow
name: CultivaTech CI/CD

# Gatilho (trigger) que inicia o workflow
on:
  push:
    branches:
      - LuSilva-dev # Roda sempre que houver um push na branch LuSilva-dev

jobs:
  # --- JOB: TESTES ---
  # Este job roda primeiro para validar o código com testes automatizados.
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Faz o checkout do código do seu repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura o ambiente Java (JDK) para os testes de back-end
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Configura o ambiente Node.js para os testes de front-end e auth-backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Usando um padrão curinga para encontrar os arquivos de lock de forma mais robusta.
          cache-dependency-path: '**/package-lock.json'

      # 4. Roda os testes para os serviços de back-end (Java)
      - name: Run backend tests (api-gateway)
        run: mvn -B test -Dspring.profiles.active=test --file api-gateway/pom.xml
        
      - name: Run backend tests (config-server)
        run: mvn -B test -Dspring.profiles.active=test -Dspring.cloud.discovery.enabled=false -Deureka.client.enabled=false --file Config-Server/pom.xml

      - name: Run backend tests (discovery-server)
        run: mvn -B test -Dspring.profiles.active=test -Dspring.cloud.discovery.enabled=false -Deureka.client.enabled=false --file discovery-server/pom.xml
        
      - name: Run backend tests (farm-production)
        run: mvn -B test -Dspring.profiles.active=test -Dspring.cloud.discovery.enabled=false -Deureka.client.enabled=false --file farm-production/pom.xml
        
      - name: Run backend tests (property-service)
        run: mvn -B test -Dspring.profiles.active=test -Dspring.cloud.discovery.enabled=false -Deureka.client.enabled=false --file Property-Service/pom.xml

      # 5. Instala as dependências e roda os testes dos serviços Node.js
      # CORREÇÃO: Adicionado passo de teste para o auth-backend (Node.js)
      - name: Install auth-backend dependencies and run tests
        run: |
          cd authentication-users/Back-End
          npm install
          npm test

      - name: Install auth-frontend dependencies and run tests
        run: |
          cd authentication-users/Front-End
          npm install
          npm test

  # --- JOB: BUILD E PUSH ---
  # Este job agora depende do sucesso do job 'test'
  build_and_push:
    runs-on: ubuntu-latest
    needs: test # Garante que este job só rode se o job 'test' passar
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest

      - name: Build and push auth-backend
        uses: docker/build-push-action@v5
        with:
          context: ./authentication-users/Back-End
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/auth-backend:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/auth-backend:latest
      
      - name: Build and push auth-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./authentication-users/Front-End
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/auth-frontend:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/auth-frontend:latest

      - name: Build and push config-server
        uses: docker/build-push-action@v5
        with:
          context: ./Config-Server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/config-server:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/config-server:latest

      - name: Build and push discovery-server
        uses: docker/build-push-action@v5
        with:
          context: ./discovery-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/discovery-server:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/discovery-server:latest

      - name: Build and push farm-production
        uses: docker/build-push-action@v5
        with:
          context: ./farm-production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/farm-production:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/farm-production:latest
      
      - name: Build and push property-service
        uses: docker/build-push-action@v5
        with:
          context: ./Property-Service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/property-service:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/property-service:latest

  # --- JOB: DEPLOY ---
  # Este job não muda, mas agora só será executado se os testes e o build passarem.
  deploy:
    runs-on: self-hosted
    needs: build_and_push
    environment: Production
    
    steps:
      - name: Deploy on Self-Hosted Runner
        run: |
          cd 'C:\Users\55319\cultivatech'
          git pull origin LuSilva-dev
          
          # Realiza o login no Docker Hub usando as credenciais do environment
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          
          # Puxa as imagens mais recentes e sobe os containers
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
